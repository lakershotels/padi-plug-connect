name: Flutter Build & Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
      
      - name: Get dependencies
        run: |
          cd flutter
          flutter pub get
      
      - name: Analyze code
        run: |
          cd flutter
          flutter analyze
      
      - name: Run tests
        run: |
          cd flutter
          flutter test
      
      - name: Build APK
        run: |
          cd flutter
          flutter build apk --release --split-per-abi
      
      - name: Build AAB (Play Store)
        run: |
          cd flutter
          flutter build appbundle --release
      
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: android-apk
          path: flutter/build/app/outputs/flutter-apk/
      
      - name: Upload AAB
        uses: actions/upload-artifact@v3
        with:
          name: android-aab
          path: flutter/build/app/outputs/bundle/release/

  build-ios:
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
      
      - name: Get dependencies
        run: |
          cd flutter
          flutter pub get
      
      - name: Build iOS
        run: |
          cd flutter
          flutter build ios --release --no-codesign
      
      - name: Upload iOS build
        uses: actions/upload-artifact@v3
        with:
          name: ios-build
          path: flutter/build/ios/iphoneos/

  deploy-play-store:
    needs: build-android
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download AAB
        uses: actions/download-artifact@v3
        with:
          name: android-aab
      
      - name: Deploy to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          packageName: com.padi.padiplus
          releaseFiles: 'release/app-release.aab'
          track: internal
          status: draft

  deploy-app-store:
    needs: build-ios
    runs-on: macos-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download iOS build
        uses: actions/download-artifact@v3
        with:
          name: ios-build
      
      - name: Upload to App Store
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: 'iphoneos/Runner.app'
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
