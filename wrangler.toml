# Wrangler configuration for Cloudflare Workers — template (Wrangler v4 compatible)
# IMPORTANT:
# - Replace placeholders before deploying.
# - NEVER put secret keys directly in this file. Use `wrangler secret put` or GitHub Actions secrets.
# - This file assumes you build a worker bundle to dist/worker.mjs using `npm run build:worker`.

name = "padi-plug-connect-worker"
account_id = "YOUR_CLOUDFLARE_ACCOUNT_ID"
workers_dev = true
compatibility_date = "2026-08-07"

# Entry file produced by your worker build. Adjust if your build outputs a different path.
main = "dist/worker.mjs"

[build]
command = "npm run build:worker"

# Non-secret public variables (safe to check in). Keep secrets out of this file.
[vars]
SUPABASE_URL = "https://lhmrvpvbhymtqqkyystr.supabase.co"
# Replace with your anon/public key (do NOT commit service_role keys here)
SUPABASE_ANON_KEY = "REPLACE_WITH_ANON_KEY"

# Optional: Cron triggers
# [[triggers.crons]]
# schedule = "0 3 * * *"  # run daily at 03:00 UTC

# Deployment notes:
# 1) Set Cloudflare account_id and zone_id in this file or use `wrangler login` to configure your account.
# 2) Set secrets (service role keys and any private API keys) via:
#    npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#    npx wrangler secret put OTHER_SECRET
#    (This stores secrets in Cloudflare and they will be available to the worker at runtime.)
# 3) In CI (GitHub Actions) prefer storing secrets as repository secrets and use `wrangler publish` with env vars injected.
# 4) Add a build script to package.json:
#    "build:worker": "esbuild src/workers/index.ts --bundle --outdir=dist --format=esm --target=es2022"
#    (Or adapt to your preferred bundler that outputs an ES module worker at dist/worker.mjs)
# 5) To publish locally:
#    npx wrangler publish           # publishes using this file (workers_dev or route/zone settings)
#    npx wrangler publish --name <name>

