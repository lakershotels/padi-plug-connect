name: padi_plug
description: "PadiPlug - African Marketplace Platform for iOS and Android"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Supabase
  supabase_flutter: ^2.8.0
  
  # State Management
  provider: ^6.0.0
  
  # HTTP & Networking
  http: ^1.1.0
  
  # Local Storage
  shared_preferences: ^2.2.0
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  
  # UI Components
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.0
  flutter_svg: ^2.0.0
  smooth_page_indicator: ^1.1.0
  
  # Forms & Validation
  flutter_form_builder: ^9.0.0
  form_builder_validators: ^9.0.0
  
  # Date & Time
  intl: ^0.19.0
  
  # Camera & Image
  image_picker: ^1.0.0
  camera: ^0.10.0
  
  # Location
  geolocator: ^10.1.0
  google_maps_flutter: ^2.5.0
  
  # Notifications
  firebase_core: ^2.24.0
  firebase_messaging: ^14.6.0
  
  # Analytics
  firebase_analytics: ^10.7.0
  
  # Deep Linking
  uni_links_web: ^1.0.0
  
  # Payment
  stripe_flutter: ^10.3.0
  
  # Logging
  logger: ^2.0.0
  
  # Device Info
  device_info_plus: ^9.1.0
  package_info_plus: ^5.0.0
  
  # Connectivity
  connectivity_plus: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^3.0.0
  
  # Code Generation
  build_runner: ^2.4.0
  hive_generator: ^2.0.0
  
  # Testing
  mocktail: ^1.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/
  
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Regular.ttf
        - asset: assets/fonts/Sora-Bold.ttf
          weight: 700
        - asset: assets/fonts/Sora-SemiBold.ttf
          weight: 600
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

# iOS Configuration
ios:
  # Platform version
  ios_minimum_version: 12.0

# Android Configuration
android:
  # Minimum SDK
  minimum_sdk_version: 21
